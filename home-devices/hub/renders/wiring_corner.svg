<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="40.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="22" font-weight="600" fill="#18181a" text-anchor="start" dominant-baseline="middle">CORNER JUMPERS · enlarged (front-right corner, from below)</text><rect x="60.0" y="137.6" width="532.0" height="386.4" rx="0.0" fill="#ecebe7" stroke="none" stroke-width="1.5"/><polyline points="60.0,137.6 340.0,137.6" fill="none" stroke="#18181a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="586.4,384.0 586.4,524.0" fill="none" stroke="#18181a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.0,137.6 A246.4,246.4 0 0 1 586.4,384.0" fill="none" stroke="#18181a" stroke-width="2"/><rect x="246.2" y="487.6" width="336.0" height="36.4" rx="0.0" fill="#ffffff" stroke="#18181a" stroke-width="1.5"/><rect x="60.0" y="141.8" width="104.2" height="336.0" rx="0.0" fill="#ffffff" stroke="#18181a" stroke-width="1.5"/><rect x="344.2" y="496.0" width="140.0" height="16.8" rx="0.0" fill="#fbf7e8" stroke="#8c8a80" stroke-width="1"/><text x="414.2" y="467.6" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#18181a" text-anchor="middle" dominant-baseline="middle">RUN 1 (end)</text><text x="102.0" y="309.8" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#18181a" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 102.0 309.8)">RUN 2 (start)</text><rect x="288.2" y="495.8" width="56.0" height="39.2" rx="3.0" fill="#2b2b2e" stroke="#18181a" stroke-width="1"/><rect x="386.2" y="495.8" width="56.0" height="39.2" rx="3.0" fill="#e0a400" stroke="#18181a" stroke-width="1"/><rect x="484.2" y="495.8" width="56.0" height="39.2" rx="3.0" fill="#d1281f" stroke="#18181a" stroke-width="1"/><rect x="116.6" y="379.8" width="39.2" height="56.0" rx="3.0" fill="#2b2b2e" stroke="#18181a" stroke-width="1"/><rect x="116.6" y="281.8" width="39.2" height="56.0" rx="3.0" fill="#e0a400" stroke="#18181a" stroke-width="1"/><rect x="116.6" y="183.8" width="39.2" height="56.0" rx="3.0" fill="#d1281f" stroke="#18181a" stroke-width="1"/><circle cx="368.0" cy="238.4" r="89.6" fill="#fde9e7" stroke="#b3261e" stroke-width="2" stroke-dasharray="8 6"/><text x="382.0" y="248.4" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#b3261e" text-anchor="start" dominant-baseline="middle">screw pocket Ø6.4</text><text x="382.0" y="270.4" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#b3261e" text-anchor="start" dominant-baseline="middle">keep wires out</text><polyline points="164.2,163.6 278.4,163.6" fill="none" stroke="#6b6b70" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="221.3" y="181.6" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#6b6b70" text-anchor="middle" dominant-baseline="middle">bay 4.1 mm</text><polyline points="316.2,515.6 316.2,459.6 186.0,459.6 186.0,407.8 136.2,407.8" fill="none" stroke="#2b2b2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="316.2,515.6 316.2,459.6 186.0,459.6 186.0,407.8 136.2,407.8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/><polyline points="414.2,515.6 414.2,431.6 214.0,431.6 214.0,309.8 136.2,309.8" fill="none" stroke="#e0a400" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="414.2,515.6 414.2,431.6 214.0,431.6 214.0,309.8 136.2,309.8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/><polyline points="512.2,515.6 512.2,395.2 244.8,395.2 244.8,211.8 136.2,211.8" fill="none" stroke="#d1281f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="512.2,515.6 512.2,395.2 244.8,395.2 244.8,211.8 136.2,211.8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/><text x="60.0" y="712.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#18181a" text-anchor="start" dominant-baseline="middle">1  Tin the six pads first, then tin each wire end.</text><text x="60.0" y="742.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#18181a" text-anchor="start" dominant-baseline="middle">2  26 AWG silicone, about 25 mm each (5V longest, GND shortest).</text><text x="60.0" y="772.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#18181a" text-anchor="start" dominant-baseline="middle">3  Route as drawn: the wires never cross and stay out of the screw circle.</text><text x="60.0" y="802.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#18181a" text-anchor="start" dominant-baseline="middle">4  Solder on the LED side; the wires sit in the 3.5 mm under the strip.</text><text x="60.0" y="832.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="500" fill="#18181a" text-anchor="start" dominant-baseline="middle">5  Check each joint for continuity, and 5V to GND for no short.</text><text x="60.0" y="682.0" font-family="IBM Plex Mono, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" fill="#6b6b70" text-anchor="start" dominant-baseline="middle">HOW</text></svg>